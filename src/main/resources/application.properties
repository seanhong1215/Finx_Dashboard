spring.application.name=finx-dashboard
server.port=8080

# MySQL is the only runtime database. The app initializes it from sql/schema.sql and sql/data.sql.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finx_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:finx_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Schema is managed by src/main/resources/schema.sql, not Hibernate DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.data-locations=classpath:sql/data.sql

# ── JWT / CORS ────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:30}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ── DevTools ──────────────────────────────────────────────────────────────────
spring.devtools.restart.enabled=true

# ── Springdoc / Swagger UI ───────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.finx=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n

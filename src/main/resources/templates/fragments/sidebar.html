<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ── Sidebar Fragment ───────────────────────────────────────────────────── -->
<aside th:fragment="sidebar(activePage)" class="sidebar">
    <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">FinX</span>
    </div>
    <nav class="nav">
        <a th:href="@{/dashboard}"
           th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
           class="nav-item">
            <span class="nav-icon">⊞</span><span>總覽</span>
        </a>
        <a th:href="@{/transactions}"
           th:classappend="${activePage == 'transactions'} ? ' active' : ''"
           class="nav-item">
            <span class="nav-icon">↕</span><span>交易紀錄</span>
        </a>
        <a th:href="@{/cards}"
           th:classappend="${activePage == 'cards'} ? ' active' : ''"
           class="nav-item">
            <span class="nav-icon">▣</span><span>我的卡片</span>
        </a>
        <a th:href="@{/crypto}"
           th:classappend="${activePage == 'crypto'} ? ' active' : ''"
           class="nav-item">
            <span class="nav-icon">◈</span><span>加密貨幣</span>
        </a>
        <a th:href="@{/stocks}"
           th:classappend="${activePage == 'stocks'} ? ' active' : ''"
           class="nav-item">
            <span class="nav-icon">↗</span><span>股票</span>
        </a>
        <a th:href="@{/profile}"
           th:classappend="${activePage == 'profile'} ? ' active' : ''"
           class="nav-item">
            <span class="nav-icon">◉</span><span>個人設定</span>
        </a>
    </nav>
    <div class="sidebar-bottom">
        <a href="#" class="nav-item">
            <span class="nav-icon">⚙</span><span>設定</span>
        </a>
    </div>
</aside>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FinX - 加密貨幣</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
    <link rel="stylesheet" th:href="@{/css/invest.css}"/>
</head>
<body>

<div th:replace="fragments/sidebar :: sidebar('crypto')"></div>

<main class="main">

    <header class="topbar">
        <div>
            <h1 class="page-title">加密貨幣</h1>
            <p class="page-sub">即時幣價 · 持倉管理</p>
        </div>
        <div class="topbar-right">
            <span class="live-badge">● LIVE</span>
            <div class="avatar">JW</div>
        </div>
    </header>

    <!-- 總覽 -->
    <section class="portfolio-banner crypto-banner">
        <div class="pb-left">
            <p class="pb-label">加密貨幣總市值</p>
            <h2 class="pb-value" th:text="'USD ' + ${#numbers.formatDecimal(totalValue, 1, 'COMMA', 2, 'POINT')}">USD 18,490.32</h2>
            <p class="pb-pnl" th:class="${isProfit} ? 'pb-pnl profit' : 'pb-pnl loss'">
                <span th:text="${isProfit} ? '▲' : '▼'">▲</span>
                <span th:text="'USD ' + ${#numbers.formatDecimal(totalPnl, 1, 'COMMA', 2, 'POINT')}">USD 432.10</span>
                <span th:text="'(' + ${pnlPct} + '%)'"> (+2.4%)</span>
            </p>
        </div>
        <div class="pb-right">
            <button class="invest-btn">＋ 買入</button>
            <button class="invest-btn outline">賣出</button>
        </div>
    </section>

    <!-- 統計 -->
    <section class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon">₿</div>
            <div class="stat-info">
                <p class="stat-label">持有幣種</p>
                <p class="stat-value" th:text="${assets.size()} + ' 種'">4 種</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📈</div>
            <div class="stat-info">
                <p class="stat-label">總損益</p>
                <p class="stat-value" th:class="${isProfit} ? 'stat-value profit-text' : 'stat-value loss-text'"
                   th:text="'USD ' + ${#numbers.formatDecimal(totalPnl, 1, 'COMMA', 2, 'POINT')}">USD +432.10</p>
            </div>
            <span class="stat-change" th:class="${isProfit} ? 'stat-change positive' : 'stat-change negative'"
                  th:text="${pnlPct} + '%'">+2.4%</span>
        </div>
        <div class="stat-card">
            <div class="stat-icon">🔄</div>
            <div class="stat-info">
                <p class="stat-label">24H 最高漲幅</p>
                <p class="stat-value" style="color:#10B981">SOL +5.8%</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">📉</div>
            <div class="stat-info">
                <p class="stat-label">24H 最大跌幅</p>
                <p class="stat-value" style="color:#EF4444">ETH -1.2%</p>
            </div>
        </div>
    </section>

    <!-- 持倉列表（計算移至 Controller，HTML 只顯示） -->
    <section class="invest-table-card">
        <div class="section-header">
            <h3>持倉明細</h3>
            <span class="record-count">即時更新</span>
        </div>

        <div class="invest-table-head">
            <span class="ic-coin">幣種</span>
            <span class="ic-price">現價 (USD)</span>
            <span class="ic-change">24H 漲跌</span>
            <span class="ic-amount">持有數量</span>
            <span class="ic-value">市值 (USD)</span>
            <span class="ic-cost">平均成本</span>
            <span class="ic-pnl">損益</span>
        </div>

        <div class="invest-row" th:each="row : ${cryptoRows}">
            <div class="ic-coin">
                <div class="coin-dot" th:style="'background:' + ${row.color}"></div>
                <div>
                    <p class="coin-symbol" th:text="${row.symbol}">BTC</p>
                    <p class="coin-name"   th:text="${row.name}">Bitcoin</p>
                </div>
            </div>
            <span class="ic-price"  th:text="${row.currentPrice}">67,420.00</span>
            <span class="ic-change" th:class="${row.changePositive} ? 'ic-change profit-text' : 'ic-change loss-text'"
                  th:text="${row.changePctStr}">+2.4%</span>
            <span class="ic-amount" th:text="${row.amount}">0.142</span>
            <span class="ic-value"  th:text="${row.marketValue}">9,573.64</span>
            <span class="ic-cost"   th:text="${row.avgCost}">52,000.00</span>
            <span class="ic-pnl"    th:class="${row.pnlPositive} ? 'ic-pnl profit-text' : 'ic-pnl loss-text'"
                  th:text="${row.pnlStr}">+7,573.64</span>
        </div>

    </section>
</main>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
